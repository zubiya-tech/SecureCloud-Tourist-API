<!DOCTYPE html>
<html>

<head>

    <title>{{ spot.name }}</title>

</head>

<body>

    <!-- Destination Name -->
    <h1>{{ spot.name }}</h1>

    <!-- City -->
    <p>
        <b>City:</b>
        {{ spot.city }}
    </p>

    <!-- Category -->
    <p>
        <b>Category:</b>
        {{ spot.category }}
    </p>

    <!-- Description -->
    <p>
        {{ spot.description }}
    </p>

</body>

</html>
